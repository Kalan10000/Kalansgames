<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalan's games</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            box-sizing: border-box;
            background-color: #1a1a1a;
            color: white;
        }

        h1 {
            margin-bottom: 2rem;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .button-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }

        .game-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .game-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(110, 142, 251, 0.4);
        }

        .game-button:active {
            transform: translateY(1px);
        }

        /* Responsive layouts for smaller screen sizes */
        @media (max-width: 1024px) {
            .button-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .button-container {
                grid-template-columns: repeat(1, 1fr);
            }
        }
    </style>
</head>

<body>

    <h1>Kalan's Games</h1>

    <div class="button-container">
        <a href="https://puzzle-time-attack.vercel.app" class="game-button">Puzzle: Time Attack</a>
        <a href="https://conways-climber.vercel.app" class="game-button">Conway's Climber</a>
        <a href="https://neon-fall.vercel.app" class="game-button">Neon Fall</a>
        <a href="https://simple-sandbox.vercel.app" class="game-button">Simple Sandbox</a>
        <a href="https://kcl-two.vercel.app" class="game-button">Kalan's Coding Language</a>
        <a href="https://squishy-ball-runner.vercel.app" class="game-button">Squishy Ball Runner thing</a>
        <a href="https://mc-textures.vercel.app" class="game-button">Minecraft's textures</a>
        <a href="https://kalansplane.vercel.app" class="game-button">Kalan's plane</a>
        <a href="https://mazeofballs.vercel.app" class="game-button">Maze of balls</a>
        <a href="https://kalanski.vercel.app" class="game-button">Kalan's ski</a>
        <a href="https://kalansea.vercel.app" class="game-button">Kalan's sea</a>
    </div>

</body>

</html>
