        const sceneMaxY = sceneTopShelfY + 1.48;
        const camCenterY = (sceneMinY + sceneMaxY) * 0.5;
        const halfH = (sceneMaxY - sceneMinY) * 0.5;
        const halfW = Math.max(3.6, sceneMaxPlankWidth * 0.5 + 0.42);

        const distForH = halfH / tanHalfFov + 2.45;
        const distForW = halfW / (tanHalfFov * aspect) + 0.95;
        const camDist = Math.max(distForH, distForW) * 1.07;

        const shakeOffset = state.cameraShake * state.cameraShake * Math.sin(now * 0.055) * 0.14;
        _eye[0] = state.camParallaxX + shakeOffset * 0.35;
        _eye[1] = camCenterY + 0.52 + state.camParallaxY + shakeOffset;
        _eye[2] = camDist;
        _target[0] = state.camParallaxX * 0.25;
        _target[1] = camCenterY - 0.08;
        _target[2] = 0.25;

        mat4Perspective(_projMat, fovRad, aspect, 0.5, 45.0);
        mat4LookAt(_viewMat, _eye, _target, _up);
        mat4Multiply(_vpMat, _projMat, _viewMat);

        gl.useProgram(glProgram);
        gl.bindVertexArray(unitBoxVao);
        gl.uniformMatrix4fv(uniforms.uViewProj, false, _vpMat);
        gl.uniform3fv(uniforms.uCameraPos, _eye);

        // Dynamic Power LED Point Light Uniforms
        gl.uniform3f(
          uniforms.uLedWorldPos,
          CONSOLE_POS[0] - 1.43,
          CONSOLE_POS[1] + 0.25,
          CONSOLE_POS[2] + 1.16
        );
        if (state.ledState === 'red') {
          gl.uniform3f(uniforms.uLedColor, 1.0, 0.22, 0.22);
          gl.uniform1f(uniforms.uLedIntensity, 1.35);
        } else if (state.ledState === 'green') {
          gl.uniform3f(uniforms.uLedColor, 0.28, 1.0, 0.52);
          gl.uniform1f(uniforms.uLedIntensity, 1.45);
        } else {
          gl.uniform3f(uniforms.uLedColor, 0.0, 0.0, 0.0);
          gl.uniform1f(uniforms.uLedIntensity, 0.0);
        }

        // 1. Render 3D Walnut Shelves
        render3DShelves();

        // 2. Render 3D NES Console & 3D Controller on Desk
        render3DConsoleAndDesk(doorAngle, trayDrop, powerPress, state.ejectPress, rearDoorAngle);

        // 3. Render Soft Contact Shadows on Shelves for Seated Shelf Cartridges
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.depthMask(false);
        mat4Identity(_consoleBaseMat);
        for (let i = 0; i < visibleGamesCache.length; i++) {
          const g = visibleGamesCache[i];
          const dispEntry = getDisplacedCartridgeEntry(g.id);
          const isAway =
            (state.animMode !== 'idle' && state.animGameId === g.id) ||
            (state.slottedGameId === g.id &&
              (state.animMode === 'seated' ||
                state.animMode === 'dragging' ||
                state.animMode === 'returning' ||
                isInsertionBusyMode(state.animMode)));
          const rt = cartridgeRuntime[g.id];
          let shadowAlpha = isAway ? 0.14 : 0.65 * (1 - rt.hoverLift * 0.35);
          if (dispEntry) {
            const dp = Math.min(1, Math.max(0, (now - dispEntry.startTime) / DISPLACED_RETURN_MS));
            shadowAlpha = 0.14 + (0.65 - 0.14) * smoothstep(0.70, 1.0, dp);
          }
          drawBoxPart(
            _consoleBaseMat,
            rt.shelfX,
            rt.shelfY + 0.004,
            rt.shelfZ,
            1.15,
            0.003,
            0.44,
            [0, 0, 0],
            -1.0,
            0,
            shadowTex,
            null,
            shadowAlpha
          );
        }
        gl.depthMask(true);
        gl.disable(gl.BLEND);

        // 4. Render All Visible Shelf 3D Cartridges
        const activeId = state.animMode === 'seated' ? state.slottedGameId : state.animGameId;

        for (let i = 0; i < visibleGamesCache.length; i++) {
          const g = visibleGamesCache[i];
          if (g.id === activeId) continue;
          if (seatedBackgroundPose && g.id === state.slottedGameId) continue;
          if (isCartridgeDisplaced(g.id)) continue;

          const rt = cartridgeRuntime[g.id];
          mat4Identity(rt.worldMat);
          mat4Translate(
            rt.worldMat,
            rt.worldMat,
            rt.shelfX,
            rt.shelfY + rt.hoverLift * 0.18,
            rt.shelfZ + rt.hoverLift * 0.30
          );
          mat4RotateY(rt.worldMat, rt.worldMat, rt.baseRotY + rt.hoverTiltY);
          mat4RotateX(rt.worldMat, rt.worldMat, rt.hoverTiltX);
          render3DCartridge(rt.worldMat, g);
        }

        // 5a. Render Already-Seated Cartridge inside Console while user drags a new one
        if (seatedBackgroundPose && state.slottedGameId) {
          const seatedGame = getCartridgeById(state.slottedGameId);
          if (seatedGame) {
            const srt = cartridgeRuntime[state.slottedGameId];
            mat4Identity(srt.worldMat);
            mat4Translate(
              srt.worldMat,
              srt.worldMat,
              seatedBackgroundPose.x,
              seatedBackgroundPose.y,
              seatedBackgroundPose.z
            );
            mat4RotateY(srt.worldMat, srt.worldMat, seatedBackgroundPose.rotY);
            mat4RotateZ(srt.worldMat, srt.worldMat, seatedBackgroundPose.rotZ);
            mat4RotateX(srt.worldMat, srt.worldMat, seatedBackgroundPose.rotX);
            render3DCartridge(srt.worldMat, seatedGame);
          }
        }

        // 5b. Render Outgoing Displaced Cartridge(s) Going Through Behind & Sliding Into Place (1.5s)
        for (let d = 0; d < activeDisplacedDraws.length; d++) {
          const dItem = activeDisplacedDraws[d];
          const dGame = getCartridgeById(dItem.id);
          if (!dGame) continue;
          const dPose = dItem.pose;
          mat4Identity(_displacedMat);
          mat4Translate(_displacedMat, _displacedMat, dPose.x, dPose.y, dPose.z);
          mat4RotateY(_displacedMat, _displacedMat, dPose.rotY);
          mat4RotateZ(_displacedMat, _displacedMat, dPose.rotZ);
          mat4RotateX(_displacedMat, _displacedMat, dPose.rotX);
          if (dPose.scale !== undefined && dPose.scale < 0.999) {
            mat4Scale(_displacedMat, _displacedMat, dPose.scale, dPose.scale, dPose.scale);
          }
          render3DCartridge(_displacedMat, dGame);
        }

        // 5c. Render Active Held / Returning / Inserting / Seated 3D Cartridge
        if (activeId && activePose) {
          const activeGame = getCartridgeById(activeId);
          if (activeGame) {
            const rt = cartridgeRuntime[activeId];
            mat4Identity(rt.worldMat);
            mat4Translate(rt.worldMat, rt.worldMat, activePose.x, activePose.y, activePose.z);
            mat4RotateY(rt.worldMat, rt.worldMat, activePose.rotY);
            mat4RotateZ(rt.worldMat, rt.worldMat, activePose.rotZ);
            mat4RotateX(rt.worldMat, rt.worldMat, activePose.rotX);
            render3DCartridge(rt.worldMat, activeGame);
          }
        }

        gl.bindVertexArray(null);
        updateProjectedHitBoxes(rect.width, rect.height);

        return keepAnimating;
      }

      function requestRender() {
        if (renderBusy) {
          renderDirty = true;
          return;
        }
        renderBusy = true;
        if (loopIdle) {
          lastFrameTime = performance.now();
          loopIdle = false;
        }
        requestAnimationFrame(function (now) {
          renderDirty = false;
          const needsMore = stepSimulationAndDraw(now);
          const done = function () {
            renderBusy = false;
            if (renderDirty || needsMore) {
              requestRender();
            } else {
              loopIdle = true;
            }
          };
          if (isSoftwareGl) {
            afterDraw(done);
          } else {
            done();
          }
        });
      }

      // =========================================================================
      // User Interaction Flows: Hold & Drag to Console, Rotate + Slide + Click, Eject
      // =========================================================================
      function startCartridgeDrag(game, e) {
        if (
          isInsertionBusyMode(state.animMode) ||
          state.animMode === 'ejecting' ||
          state.animMode === 'dragging'
        ) {
          return;
        }

        // Warm AudioContext on user gesture so the mechanical click plays with zero latency
        getAudioContext();

        const wasReturningSame =
          state.animMode === 'returning' && state.animGameId === game.id;
        const rt = cartridgeRuntime[game.id];

        if (!wasReturningSame) {
          const c0 = cartridgeRootToCenter(
            rt.shelfX,
            rt.shelfY + rt.hoverLift * 0.18,
            rt.shelfZ + rt.hoverLift * 0.30,
            rt.hoverTiltX,
            rt.baseRotY + rt.hoverTiltY,
            0
          );
          state.dragCenter.cx = c0[0];
          state.dragCenter.cy = c0[1];
          state.dragCenter.cz = c0[2];
          state.dragCenter.rotX = rt.hoverTiltX;
          state.dragCenter.rotY = rt.baseRotY + rt.hoverTiltY;
          state.dragCenter.rotZ = 0;
        }

        state.dragCenter.freeRotX = state.dragCenter.rotX;
        state.dragCenter.freeRotY = state.dragCenter.rotY;
        state.dragCenter.freeRotZ = state.dragCenter.rotZ;

        state.hoveredGameId = null;
        state.animMode = 'dragging';
        state.animGameId = game.id;
        state.holdRotateProgress = 0;
        state.lastHoldTickMs = performance.now();

        const worldPt = screenClientToCarryWorld(e.clientX, e.clientY);
        state.grabOffsetX = state.dragCenter.cx - worldPt[0];
        state.grabOffsetY = state.dragCenter.cy - worldPt[1];
        state.dragStartClientX = e.clientX;
        state.dragStartClientY = e.clientY;
        state.dragStartTimeMs = performance.now();
        state.dragMaxTravelPx = 0;
        state.dragTarget[0] = state.dragCenter.cx;
        state.dragTarget[1] = state.dragCenter.cy;
        state.dragTarget[2] = worldPt[2];

        document.body.classList.add('is-dragging-cartridge');
        consoleReadoutEl.textContent =
          'Holding ' + game.title + ' · Hold over the console slot to insert';

        syncHitButtonsState();
        requestRender();
      }

      function updateCartridgeDragPointer(clientX, clientY) {
        if (state.animMode !== 'dragging' || !state.animGameId) return;
        const travelPx = Math.hypot(
          clientX - state.dragStartClientX,
          clientY - state.dragStartClientY
        );
        if (travelPx > state.dragMaxTravelPx) {
          state.dragMaxTravelPx = travelPx;
        }
        const offsetWeight = Math.max(0, 1 - travelPx / 260);
        const worldPt = screenClientToCarryWorld(clientX, clientY);
        state.dragTarget[0] = worldPt[0] + state.grabOffsetX * offsetWeight;
        state.dragTarget[1] = worldPt[1] + state.grabOffsetY * offsetWeight;
        state.dragTarget[2] = worldPt[2];
        requestRender();
      }

      function triggerShelfCartridgeClickInsert(game) {
        if (
          !game ||
          isInsertionBusyMode(state.animMode) ||
          state.animMode === 'ejecting' ||
          (state.slottedGameId === game.id && state.animMode === 'seated')
        ) {
          return;
        }
        document.body.classList.remove('is-dragging-cartridge');
        clearPendingTimers();
        getAudioContext();

        const now = performance.now();
        if (state.slottedGameId && state.slottedGameId !== game.id) {
          beginDisplacedCartridgeReturn(state.slottedGameId, now, true);
        }
        removeDisplacedCartridge(game.id);

        state.hoveredGameId = null;
        state.slottedGameId = game.id;
        state.animGameId = game.id;
        state.clickSoundPlayed = false;
        state.insertDurationMs = SHELF_CLICK_INSERT_MS;
        state.animStartTime = now;
        state.animProgress = 0;
        state.animMode = 'shelf-inserting';

        setLedState('red');
        consoleReadoutEl.textContent = 'Sliding ' + game.title + ' into console...';
        launchLinkEl.hidden = true;
        ejectBtnEl.disabled = true;
        syncHitButtonsState();
        requestRender();
      }

      function finishCartridgeDrag() {
        if (state.animMode !== 'dragging' || !state.animGameId) return;
        document.body.classList.remove('is-dragging-cartridge');

        const heldGame = GAMES.find(function (g) {
          return g.id === state.animGameId;
        });
        const proxPose = evaluateConsoleProximity(
          state.dragCenter.cx,
          state.dragCenter.cy,
          CONSOLE_SLOT_POS
        );

        if (heldGame && proxPose.inCaptureZone) {
          // Released right over the console slot: finish rotating in place at exact held center, then slide in!
          commitSnapInsert(heldGame, state.dragCenter, state.holdRotateProgress * SNAP_ROTATE_END);
          return;
        }

        // Quick click / tap on a shelf cartridge without dragging: run the 2-second 3D arc & slide-in then open!
        const heldDurationMs = performance.now() - state.dragStartTimeMs;
        if (heldGame && state.dragMaxTravelPx <= 10 && heldDurationMs < 360) {
          state.animMode = 'idle';
          triggerShelfCartridgeClickInsert(heldGame);
          return;
        }

        // Released away from console after dragging: restore LED and smoothly return cartridge to its shelf spot
        setLedState(state.slottedGameId ? 'green' : 'off');
        state.snapStartPose = {
          cx: state.dragCenter.cx,
          cy: state.dragCenter.cy,
          cz: state.dragCenter.cz,
          rotX: state.dragCenter.rotX,
          rotY: state.dragCenter.rotY,
          rotZ: state.dragCenter.rotZ
        };
        state.animMode = 'returning';
        state.animStartTime = performance.now();
        syncHitButtonsState();

        if (state.slottedGameId) {
          const running = getCartridgeById(state.slottedGameId);
          if (running) {
            consoleReadoutEl.textContent = running.isControllerPak
              ? 'Expansion Cartridge Loaded'
              : 'Running: ' + running.title;
          }
        } else if (heldGame) {
          consoleReadoutEl.textContent =
            'Click or drag ' + heldGame.title + ' to the console slot to load';
        }
        requestRender();
      }

      function completeCartridgeInsertion() {
        const game = getCartridgeById(state.slottedGameId);
        if (!game) return;

        state.animMode = 'seated';
        state.animGameId = null;
        syncHitButtonsState();

        setLedState('green');
        consoleReadoutEl.textContent = game.isControllerPak
          ? 'Expansion Cartridge Loaded'
          : 'Running: ' + game.title;
        launchLinkEl.href = game.url;
        launchLinkEl.hidden = false;
        ejectBtnEl.disabled = false;
        requestRender();
        openUrlInNewTab(game.url);
      }

      function commitSnapInsert(game, startPose, initialProgress, customTotalMs) {
        if (isInsertionBusyMode(state.animMode) || state.animMode === 'ejecting') return;
        document.body.classList.remove('is-dragging-cartridge');
        clearPendingTimers();

        const startP = Math.max(0, Math.min(SNAP_ROTATE_END, initialProgress || 0));
        const totalMs = customTotalMs || SNAP_INSERT_MS;
        const now = performance.now();

        if (state.slottedGameId && state.slottedGameId !== game.id) {
          beginDisplacedCartridgeReturn(state.slottedGameId, now, true);
        }
        removeDisplacedCartridge(game.id);

        state.hoveredGameId = null;
        state.slottedGameId = game.id;
        state.animGameId = game.id;
        state.clickSoundPlayed = false;
        state.insertDurationMs = totalMs;
        state.animStartTime = now - startP * totalMs;
        state.snapStartPose = {
          cx: startPose.cx,
          cy: startPose.cy,
          cz: startPose.cz,
          rotX: startPose.rotX,
          rotY: startPose.rotY,
          rotZ: startPose.rotZ
        };

        setLedState('red');
        consoleReadoutEl.textContent = game.isControllerPak
          ? 'Sliding cartridge into console...'
          : 'Inserting ' + game.title + '...';
        launchLinkEl.hidden = true;
        ejectBtnEl.disabled = true;

        state.animMode = 'inserting';
        state.animProgress = startP;
        syncHitButtonsState();
        requestRender();
      }

      function triggerControllerCartridgeInsert(side) {
        if (state.animMode === 'dragging') return;
        getAudioContext();
        playClickSound('latch');
        if (side === 'left') {
          state.ctrlLeftPress = 0.044;
        } else {
          state.ctrlRightPress = 0.044;
        }

        const pak = CONTROLLER_CARTRIDGES[side === 'left' ? 0 : 1];
        if (!pak) return;

        // Ignore accidental double-tap on the same active controller insert while already mid-flight
        if (state.animMode === 'ctrl-inserting' && state.slottedGameId === pak.id) {
          requestRender();
          return;
        }

        document.body.classList.remove('is-dragging-cartridge');
        clearPendingTimers();

        const now = performance.now();
        if (state.slottedGameId && state.slottedGameId !== pak.id) {
          beginDisplacedCartridgeReturn(state.slottedGameId, now, false);
        }
        removeDisplacedCartridge(pak.id);

        state.hoveredGameId = null;
        state.slottedGameId = pak.id;
        state.animGameId = pak.id;
        state.animCtrlSide = side === 'left' ? 'left' : 'right';
        state.clickSoundPlayed = false;
        state.insertDurationMs = CTRL_INSERT_MS;
        state.animStartTime = now;
        state.animProgress = 0;
        state.animMode = 'ctrl-inserting';

        setLedState('red');
        consoleReadoutEl.textContent = 'Sliding cartridge into console...';
        launchLinkEl.hidden = true;
        ejectBtnEl.disabled = true;

        syncHitButtonsState();
        requestRender();
      }

      function triggerEjectCartridge() {
        if (!state.slottedGameId || isInsertionBusyMode(state.animMode) || state.animMode === 'ejecting') {
          return;
        }
        clearPendingTimers();
        playClickSound('eject');

        const ejectedId = state.slottedGameId;
        state.slottedGameId = null;
        state.ejectPress = 0.075;

        setLedState('off');
        launchLinkEl.hidden = true;
        launchLinkEl.removeAttribute('href');
        ejectBtnEl.disabled = true;
        consoleReadoutEl.textContent = 'Console Ready · Click or drag a cartridge to the slot';

        state.animMode = 'ejecting';
        state.animGameId = ejectedId;
        state.animProgress = 1.0;
        state.animStartTime = performance.now();
        syncHitButtonsState();
        requestRender();
      }

      function renderCategoryBar() {
        categoryBarEl.innerHTML = '';
        CATEGORIES.forEach(function (category) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'filter-btn';
          btn.textContent = category;
          btn.setAttribute('aria-pressed', String(state.activeCategory === category));
          btn.addEventListener('click', function () {
            if (state.activeCategory === category) return;
            state.activeCategory = category;
            renderCategoryBar();
            computeShelfLayout();
            rebuildHitButtonsDOM();
            requestRender();
          });
          categoryBarEl.appendChild(btn);
        });
      }

      // Wire Search, Reset, Pointer Dragging, Parallax, Resize & WebGL Context Recovery
      searchInputEl.addEventListener('input', function (e) {
        state.searchQuery = e.target.value;
        searchClearEl.hidden = state.searchQuery.length === 0;
        computeShelfLayout();
        rebuildHitButtonsDOM();
        requestRender();
      });

      searchClearEl.addEventListener('click', function () {
        state.searchQuery = '';
        searchInputEl.value = '';
        searchClearEl.hidden = true;
        computeShelfLayout();
        rebuildHitButtonsDOM();
        requestRender();
        searchInputEl.focus();
      });

      resetFiltersEl.addEventListener('click', function () {
        state.activeCategory = 'All';
        state.searchQuery = '';
        searchInputEl.value = '';
        searchClearEl.hidden = true;
        renderCategoryBar();
        computeShelfLayout();
        rebuildHitButtonsDOM();
        requestRender();
      });

      ejectBtnEl.addEventListener('click', triggerEjectCartridge);

      if (ctrlLeftBtnEl) {
        ctrlLeftBtnEl.addEventListener('pointerenter', function () {
          state.hoveredCtrlBtn = 'left';
          requestRender();
        });
        ctrlLeftBtnEl.addEventListener('pointerleave', function () {
          if (state.hoveredCtrlBtn === 'left') {
            state.hoveredCtrlBtn = null;
            requestRender();
          }
        });
        ctrlLeftBtnEl.addEventListener('focus', function () {
          state.hoveredCtrlBtn = 'left';
          requestRender();
        });
        ctrlLeftBtnEl.addEventListener('blur', function () {
          if (state.hoveredCtrlBtn === 'left') {
            state.hoveredCtrlBtn = null;
            requestRender();
          }
        });
        ctrlLeftBtnEl.addEventListener('click', function () {
          triggerControllerCartridgeInsert('left');
        });
      }

      if (ctrlRightBtnEl) {
        ctrlRightBtnEl.addEventListener('pointerenter', function () {
          state.hoveredCtrlBtn = 'right';
          requestRender();
        });
        ctrlRightBtnEl.addEventListener('pointerleave', function () {
          if (state.hoveredCtrlBtn === 'right') {
            state.hoveredCtrlBtn = null;
            requestRender();
          }
        });
        ctrlRightBtnEl.addEventListener('focus', function () {
          state.hoveredCtrlBtn = 'right';
          requestRender();
        });
        ctrlRightBtnEl.addEventListener('blur', function () {
          if (state.hoveredCtrlBtn === 'right') {
            state.hoveredCtrlBtn = null;
            requestRender();
          }
        });
        ctrlRightBtnEl.addEventListener('click', function () {
          triggerControllerCartridgeInsert('right');
        });
      }

      // Stage-level click fallback over the 3D controller body (covers D-pad, button edges & slight mouse drift)
      stageMainEl.addEventListener('click', function (e) {
        if (!ctrlScreenBounds.valid || state.animMode === 'dragging') return;
        const target = e.target;
        if (
          target === ctrlLeftBtnEl ||
          target === ctrlRightBtnEl ||
          (target && typeof target.closest === 'function' && (target.closest('.cartridge-hit') || target.closest('#empty-shelf')))
        ) {
          return;
        }
        const rect = stageMainEl.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        if (
          x >= ctrlScreenBounds.leftX &&
          x <= ctrlScreenBounds.rightX &&
          y >= ctrlScreenBounds.topY &&
          y <= ctrlScreenBounds.botY
        ) {
          triggerControllerCartridgeInsert(x < ctrlScreenBounds.midBtnX ? 'left' : 'right');
        }
      });

      window.addEventListener('pointermove', function (e) {
        const rect = stageMainEl.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
          state.pointerNdcX = Math.max(-1, Math.min(1, ((e.clientX - rect.left) / rect.width) * 2 - 1));
          state.pointerNdcY = Math.max(-1, Math.min(1, 1 - ((e.clientY - rect.top) / rect.height) * 2));
          if (state.animMode === 'dragging') {
            updateCartridgeDragPointer(e.clientX, e.clientY);
          } else {
            requestRender();
          }
        }
      });

      window.addEventListener('pointerup', finishCartridgeDrag);
      window.addEventListener('pointercancel', finishCartridgeDrag);

      window.addEventListener('resize', function () {
        computeShelfLayout();
        requestRender();
      });

      canvasEl.addEventListener('webglcontextlost', function (e) {
        e.preventDefault();
      });
      canvasEl.addEventListener('webglcontextrestored', function () {
        initWebGL();
        requestRender();
      });

      // Boot 3D Scene & UI
      initWebGL();
      renderCategoryBar();
      computeShelfLayout();
      rebuildHitButtonsDOM();
      requestRender();

      // Re-bake high-DPI cartridge label textures once Press Start 2P finishes loading
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          rebuildCartridgeTextures();
          requestRender();
        });
      }
    </script>
  </body>
</html>
